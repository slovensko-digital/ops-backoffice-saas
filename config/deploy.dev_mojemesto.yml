service: "ops-backoffice-mojemesto"

image: "sd/ops-backoffice-mojemesto"

servers:
  web:
    hosts:
      - mojemesto.ops.dev.slovensko.digital
    proxy:
      host: mojemesto.ops.dev.slovensko.digital
    options:
      memory: 1.5g

  websocket:
    hosts:
      - mojemesto.ops.dev.slovensko.digital

  worker:
    hosts:
      - mojemesto.ops.dev.slovensko.digital

proxy:
  host: mojemesto.ops.dev.slovensko.digital

env:
  clear:
    SERVICE_NAME: ops-backoffice-mojemesto
    FQDN: mojemesto.ops.dev.slovensko.digital
    REDIS_URL: "redis://ops-backoffice-mojemesto-redis:6379/1"
    ELASTICSEARCH_NAMESPACE: ops-backoffice-zammad-mojemesto
    ZAMMAD_ELASTICSEARCH_USER: ops-backoffice-zammad-mojemesto
    OPS_CONNECTOR_URL: https://ops.dev.slovensko.digital
    OPS_PORTAL_URL: https://ops.dev.slovensko.digital
    ORGANIZATION: Moje Mesto
    PRODUCT_NAME: Backoffice
    WEBHOOK_TENANT_ID: 10
    OPS_RESPONSIBLE_SUBJECT: Moje Mesto
    OPS_RESPONSIBLE_SUBJECT_ID: 416

    NOTIFICATION_SENDER: "DEV | Moje Mesto | Backoffice"
    NOTIFICATION_SMTP_USER: noreply-mojemesto@ops.dev.slovensko.digital

    POSTGRESQL_USER: ops_backoffice_mojemesto
    POSTGRESQL_DB: ops_backoffice_mojemesto_staging
    POSTGRESQL_HOST: host.docker.internal
    POSTGRESQL_OPTIONS: "?pool=50"

volumes:
  - "ops-backoffice-mojemesto-storage:/opt/zammad/storage"
