name: Deploy

# Called by `Deploy to DEV` and `Deploy to PROD`. Builds the images of the chosen towns
# once (build.yml), then deploys the towns, at most 3 at a time.

on:
  workflow_call:
    inputs:
      stage:
        description: dev or prod, the prefix of the Kamal destinations
        required: true
        type: string
      destination:
        description: A Kamal destination, or `all` for every config/deploy.<stage>_*.yml
        required: true
        type: string

jobs:
  destinations:
    name: List destinations
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
      json: ${{ steps.list.outputs.json }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          sparse-checkout: config

      - name: List destinations
        id: list
        env:
          STAGE: ${{ inputs.stage }}
          DESTINATION: ${{ inputs.destination }}
        run: |
          set -euo pipefail
          if [[ "$STAGE" == prod && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::PROD deploys run only from main, not from $GITHUB_REF"
            exit 1
          fi

          if [[ "$DESTINATION" == all ]]; then
            destinations=$(ls config/deploy."$STAGE"_*.yml | sed -E 's|config/deploy\.(.*)\.yml|\1|')
          else
            if [[ "$DESTINATION" != "$STAGE"_* || ! -f "config/deploy.$DESTINATION.yml" ]]; then
              echo "::error::$DESTINATION is not a $STAGE destination with a config/deploy.$DESTINATION.yml"
              exit 1
            fi
            destinations=$DESTINATION
          fi

          {
            echo "### Deploying to ${STAGE^^}"
            for destination in $destinations; do echo "- \`$destination\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

          echo "list=$(echo $destinations)" >> "$GITHUB_OUTPUT"
          echo "json=$(jq -cn '$ARGS.positional' --args $destinations)" >> "$GITHUB_OUTPUT"

  build:
    needs: destinations
    uses: ./.github/workflows/build.yml
    with:
      destinations: ${{ needs.destinations.outputs.list }}
    secrets: inherit

  deploy:
    name: Deploy ${{ matrix.destination }}
    needs: [destinations, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        destination: ${{ fromJSON(needs.destinations.outputs.json) }}
    environment:
      name: ${{ matrix.destination }}
      url: ${{ steps.url.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true # installs Kamal from the Gemfile

      - name: Read URL
        id: url
        run: |
          host=$(ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).dig("proxy", "host")' "config/deploy.${{ matrix.destination }}.yml")
          echo "url=https://$host" >> "$GITHUB_OUTPUT"

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.OPS_PROD_DEPLOY_KEY }}

      - name: Kamal accessory and deploy
        env:
          KAMAL_REGISTRY_USERNAME: ${{ secrets.KAMAL_REGISTRY_USERNAME }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ZAMMAD_ELASTICSEARCH_PASSWORD: ${{ secrets.ZAMMAD_ELASTICSEARCH_PASSWORD }}
          S3_URL: ${{ secrets.S3_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GOOGLE_OAUTH2_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH2_CLIENT_ID }}
          GOOGLE_OAUTH2_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH2_CLIENT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          NOTIFICATION_SMTP_HOST: ${{ vars.NOTIFICATION_SMTP_HOST }}
          NOTIFICATION_SMTP_PORT: ${{ vars.NOTIFICATION_SMTP_PORT }}
          NOTIFICATION_SMTP_USER: ${{ secrets.NOTIFICATION_SMTP_USER }}
          NOTIFICATION_SMTP_PASSWORD: ${{ secrets.NOTIFICATION_SMTP_PASSWORD }}
          MONITORING_TOKEN: ${{ vars.MONITORING_TOKEN }}
          RAILS_LOG_LEVEL: ${{ vars.RAILS_LOG_LEVEL }}

        # `accessory boot` starts Redis only where its container does not exist yet (a new destination);
        # a running Redis is left alone. `deploy -P` pulls the image built by build.yml instead of building it.
        run: |
          bundle exec kamal accessory boot -d ${{ matrix.destination }} all
          bundle exec kamal deploy -P -d ${{ matrix.destination }}
