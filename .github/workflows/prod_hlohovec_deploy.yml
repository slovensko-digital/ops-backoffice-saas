name: PROD Hlohovec Deploy

on:
  workflow_call:
    inputs:
      build:
        description: Build the image first; false when the caller has already built it
        type: boolean
        default: true
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod_hlohovec
      environment_url: https://hlohovec.odkazprestarostu.sk
      # null on workflow_dispatch
      build: ${{ inputs.build != false }}

    secrets: inherit
