name: PROD Batch A Deployments

on:
  workflow_dispatch:

# builds all images once, then deploys the towns, at most 3 at a time
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      destinations: prod_lamac prod_nitra prod_trnava prod_ruzomberok
    secrets: inherit

  deploy:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - environment: prod_lamac
            url: https://lamac.odkazprestarostu.sk
          - environment: prod_nitra
            url: https://nitra.odkazprestarostu.sk
          - environment: prod_trnava
            url: https://trnava.odkazprestarostu.sk
          - environment: prod_ruzomberok
            url: https://ruzomberok.odkazprestarostu.sk
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ matrix.environment }}
      environment_url: ${{ matrix.url }}
      build: false
    secrets: inherit
