name: PROD Batch A Deployments

on:
  workflow_dispatch:

jobs:
  prod_lamac:
    uses: ./.github/workflows/prod_lamac_deploy.yml
    secrets: inherit

  prod_nitra:
    needs: prod_lamac
    if: ${{ always() }}
    uses: ./.github/workflows/prod_nitra_deploy.yml
    secrets: inherit

  prod_trnava:
    needs: prod_nitra
    if: ${{ always() }}
    uses: ./.github/workflows/prod_trnava_deploy.yml
    secrets: inherit

  prod_ruzomberok:
    needs: prod_trnava
    if: ${{ always() }}
    uses: ./.github/workflows/prod_ruzomberok_deploy.yml
    secrets: inherit
