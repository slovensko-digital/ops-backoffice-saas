name: DEV All Deployments

on:
  workflow_dispatch:

# builds all images once, then deploys the towns, at most 3 at a time
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      destinations: dev_mojemesto dev_magistrat_ba dev_malacky
    secrets: inherit

  deploy:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - environment: dev_mojemesto
            url: https://mojemesto.ops.dev.slovensko.digital
          - environment: dev_magistrat_ba
            url: https://magistrat-ba.ops.dev.slovensko.digital
          - environment: dev_malacky
            url: https://malacky.ops.dev.slovensko.digital
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ matrix.environment }}
      environment_url: ${{ matrix.url }}
      build: false
    secrets: inherit
