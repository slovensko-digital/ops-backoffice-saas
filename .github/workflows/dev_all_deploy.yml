name: DEV All Deployments

on:
  workflow_dispatch:

jobs:
  dev_mojemesto:
    uses: ./.github/workflows/dev_mojemesto_deploy.yml
    secrets: inherit

  dev_magistrat_ba:
    needs: dev_mojemesto
    if: ${{ always() }}
    uses: ./.github/workflows/dev_magistrat_ba_deploy.yml
    secrets: inherit

  dev_malacky:
    needs: dev_magistrat_ba
    if: ${{ always() }}
    uses: ./.github/workflows/dev_malacky_deploy.yml
    secrets: inherit
