name: PROD Batch B Deployments

on:
  workflow_dispatch:

# builds all images once, then deploys the towns, at most 3 at a time
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      destinations: prod_malacky prod_sabinov prod_banska_bystrica prod_hlohovec prod_bratislava
    secrets: inherit

  deploy:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - environment: prod_malacky
            url: https://malacky.odkazprestarostu.sk
          - environment: prod_sabinov
            url: https://sabinov.odkazprestarostu.sk
          - environment: prod_banska_bystrica
            url: https://banska-bystrica.odkazprestarostu.sk
          - environment: prod_hlohovec
            url: https://hlohovec.odkazprestarostu.sk
          - environment: prod_bratislava
            url: https://bratislava.odkazprestarostu.sk
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ matrix.environment }}
      environment_url: ${{ matrix.url }}
      build: false
    secrets: inherit
